                'box-shadow: 0 2px 8px rgba(0,0,0,0.35); font-family: sans-serif; text-align: center; min-width: 260px;';
            panel.innerHTML =
                '<button id="animation_control_9a32b38499c8f7481a6e0e6108ee1086-rewind" style="width: 2.2em; margin-right: 4px;">&#9664;&#9664;</button>' +
                '<button id="animation_control_9a32b38499c8f7481a6e0e6108ee1086-play" style="width: 2.2em; margin-right: 4px;">&#9654;</button>' +
                '<button id="animation_control_9a32b38499c8f7481a6e0e6108ee1086-forward" style="width: 2.2em; margin-right: 8px;">&#9654;&#9654;</button>' +
                '<input id="animation_control_9a32b38499c8f7481a6e0e6108ee1086-scrub" type="range" min="0" max="' + (layers.length - 1) + '" value="0" style="width: 200px; vertical-align: middle;">' +
                '<div id="animation_control_9a32b38499c8f7481a6e0e6108ee1086-label" style="margin-top: 4px; font-size: 1.1em; font-weight: 600;"></div>';
            document.body.appendChild(panel);

            var playBtn = document.getElementById('animation_control_9a32b38499c8f7481a6e0e6108ee1086-play');
            var rewindBtn = document.getElementById('animation_control_9a32b38499c8f7481a6e0e6108ee1086-rewind');
            var forwardBtn = document.getElementById('animation_control_9a32b38499c8f7481a6e0e6108ee1086-forward');
            var scrub = document.getElementById('animation_control_9a32b38499c8f7481a6e0e6108ee1086-scrub');
            var labelEl = document.getElementById('animation_control_9a32b38499c8f7481a6e0e6108ee1086-label');

            function showFrame(i) {
                layers.forEach(function(layer) { if (map.hasLayer(layer)) map.removeLayer(layer); });
                map.addLayer(layers[i]);
                scrub.value = i;
                labelEl.textContent = labels[i];
                current = i;
            }

            function pause() {
                if (timer) { clearInterval(timer); timer = null; }
                playBtn.innerHTML = '&#9654;';
            }

            function play() {
                if (timer) return;
                playBtn.innerHTML = '&#10074;&#10074;';
                timer = setInterval(function() {
                    showFrame((current + 1) % layers.length);
                }, intervalMs);
            }

            function step(delta) {
                pause();
                showFrame((current + delta + layers.length) % layers.length);
            }

            playBtn.addEventListener('click', function() { timer ? pause() : play(); });
            rewindBtn.addEventListener('click', function() { step(-1); });
            forwardBtn.addEventListener('click', function() { step(1); });
            scrub.addEventListener('input', function() { pause(); showFrame(parseInt(scrub.value, 10)); });

            showFrame(0);
        })();
        
</script>
</html>
