                '<input id="animation_control_141723f56ff1f322032477f98ca60eb9-scrub" type="range" min="0" max="' + (layers.length - 1) + '" value="0" style="width: 200px; vertical-align: middle;">' +
                '<div id="animation_control_141723f56ff1f322032477f98ca60eb9-label" style="margin-top: 4px; font-size: 1.1em; font-weight: 600;"></div>';
            document.body.appendChild(panel);

            var playBtn = document.getElementById('animation_control_141723f56ff1f322032477f98ca60eb9-play');
            var scrub = document.getElementById('animation_control_141723f56ff1f322032477f98ca60eb9-scrub');
            var labelEl = document.getElementById('animation_control_141723f56ff1f322032477f98ca60eb9-label');

            function showFrame(i) {
                layers.forEach(function(layer) { if (map.hasLayer(layer)) map.removeLayer(layer); });
                map.addLayer(layers[i]);
                scrub.value = i;
                labelEl.textContent = labels[i];
                current = i;
            }

            function pause() {
                if (timer) { clearInterval(timer); timer = null; }
                playBtn.innerHTML = '&#9654;';
            }

            function play() {
                if (timer) return;
                playBtn.innerHTML = '&#10074;&#10074;';
                timer = setInterval(function() {
                    showFrame((current + 1) % layers.length);
                }, intervalMs);
            }

            playBtn.addEventListener('click', function() { timer ? pause() : play(); });
            scrub.addEventListener('input', function() { pause(); showFrame(parseInt(scrub.value, 10)); });

            showFrame(0);
        })();
        
</script>
</html>
