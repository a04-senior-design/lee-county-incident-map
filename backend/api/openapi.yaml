openapi: 3.1.0

info:
  title: Lee County Incident API
  version: "1.0"
  description: |
    Read-only access to Lee County public safety incidents.

    Raw `nature` text is mapped to a stable `category` code by every endpoint,
    so callers never handle it. Unmapped values read as `OTHER`.

servers:
  - url: http://localhost:5001
    description: local development

paths:
  /api/v1/health:
    get:
      summary: Liveness and data freshness
      responses:
        "200":
          description: The service and database are reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  dataset_revision: { type: integer }
        "503":
          description: The database is unreachable.

  /api/v1/incidents:
    get:
      summary: List incidents
      description: |
        Newest first. Paginate with `cursor`, not an offset, so results stay
        stable while new incidents arrive.
      parameters:
        - $ref: "#/components/parameters/days"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/category"
        - $ref: "#/components/parameters/city"
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/bbox"
        - $ref: "#/components/parameters/mapped"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: format
          in: query
          description: |
            `geojson` returns a FeatureCollection ready for Leaflet, and
            defaults `mapped` to true unless you set it explicitly.
          schema:
            type: string
            enum: [json, geojson]
            default: json
      responses:
        "200":
          description: Matching incidents.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IncidentPage"
                  - $ref: "#/components/schemas/FeatureCollection"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/incidents/{source}/{source_incident_id}:
    get:
      summary: One incident
      description: |
        Both path segments are needed: `source_incident_id` alone is not unique
        across sources.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [lee_county, lee_county_traffic]
        - name: source_incident_id
          in: path
          required: true
          schema: { type: string }
          example: "25-001"
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "404":
          description: No such incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/incident-types:
    get:
      summary: Category catalog
      description: |
        Every active category with its incident count. Build filter menus from
        this rather than hardcoding codes, which change as new categories are
        added. Counts cover the whole dataset and ignore query filters.
      responses:
        "200":
          description: Categories in display order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset_revision: { type: integer }
                  types:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: VIOLENT }
                        label: { type: string, example: Violent Crime }
                        sort_order: { type: integer }
                        incident_count: { type: integer }

  /api/v1/stats/summary:
    get:
      summary: Aggregates for charts
      description: |
        Accepts the same filters as the incident list, so a chart always matches
        the map beside it. All time grouping uses America/New_York.
      parameters:
        - $ref: "#/components/parameters/days"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/category"
        - $ref: "#/components/parameters/city"
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/bbox"
        - $ref: "#/components/parameters/mapped"
      responses:
        "200":
          description: Totals and breakdowns.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/kde-heatmap:
    get:
      summary: KDE heatmap of the mapped incidents
      description: |
        One heatmap image over the incidents with a trusted coordinate inside
        Lee County. start_date and end_date are read as UTC, like the other
        KDE and DBSCAN routes, and without them every incident is used. Takes
        the same category, city, source and bbox filters as /api/v1/incidents;
        days, from and to are refused. With
        cluster_set=1 it uses the cluster levels from a /api/v1/clusters run
        instead, one bandwidth per level, so it needs that run's run_id; the
        filters are ignored then, so pass them to /api/v1/clusters.
        dbscan_status says whether the run's results can be used, and is
        missing without a run_id. The response is kept for an hour under the
        run_id it returns, for /api/v1/reports?kde_run=.
      parameters:
        - name: start_date
          in: query
          description: Defaults to the earliest incident.
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Defaults to the latest incident.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/category"
        - $ref: "#/components/parameters/city"
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/bbox"
        - name: bandwidth
          in: query
          description: |
            KDE bandwidth in feet, repeated once per cluster level and
            non-increasing. Clamped to 500 to 10000. Defaults to 1500 for
            every level.
          schema: { type: array, items: { type: number } }
          style: form
          explode: true
        - name: cluster_set
          in: query
          description: Index into cluster_set_labels.
          schema: { type: integer, enum: [0, 1], default: 0 }
        - name: run_id
          in: query
          description: The run_id from /api/v1/clusters. Needed for cluster_set=1.
          schema: { type: string, pattern: "^[0-9a-f]{32}$" }
      responses:
        "200":
          description: The heatmap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KdeHeatmap" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/animation/kde-heatmap:
    get:
      summary: KDE heatmap animation frames
      description: |
        Slides a window of window_length from start_date to end_date in steps
        of time_step, and returns one heatmap per window from the mapped
        incidents inside it. Dates are read as UTC. A window covers
        window_start to window_end, excluding window_end, except the last
        window, which is cut off at end_date and includes it. Each frame has
        its own bounds, but all frames share one color scale, so a color
        means the same density in every frame. At most 30 windows.
        Takes the same category, city, source and bbox filters as
        /api/v1/incidents. Dates come only from start_date and end_date, so
        days, from and to are refused.
      parameters:
        - $ref: "#/components/parameters/category"
        - $ref: "#/components/parameters/city"
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/bbox"
        - name: start_date
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-09-01"
        - name: end_date
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-10-01"
        - name: window_length
          in: query
          required: true
          description: A pandas offset such as 1D, 7D or 2W.
          schema: { type: string }
          example: 7D
        - name: time_step
          in: query
          required: true
          description: A pandas offset such as 1D, 7D or 2W.
          schema: { type: string }
          example: 1D
        - name: bandwidth
          in: query
          required: true
          description: KDE bandwidth in feet. Clamped to 500 to 10000.
          schema: { type: number }
          example: 1500
      responses:
        "200":
          description: The frames, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KdeAnimation" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/clusters:
    get:
      summary: DBSCAN clusters over one date range
      description: |
        Runs DBSCAN at each enabled level over the mapped incidents in one
        range, read as UTC. The range defaults to the last 30 days and is
        capped at 60, because DBSCAN memory grows with the square of the
        number of incidents. Each incident's cluster level is kept for an
        hour under the returned run_id, for /api/v1/kde-heatmap?cluster_set=1,
        and so is the response, for /api/v1/reports?dbscan_run=.
        Takes the same category, city, source and bbox filters as
        /api/v1/incidents. Dates come only from start_date and end_date, so
        days, from and to are refused.
      parameters:
        - $ref: "#/components/parameters/category"
        - $ref: "#/components/parameters/city"
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/bbox"
        - name: start_date
          in: query
          description: Defaults to 30 days before end_date.
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Defaults to now.
          schema: { type: string, format: date }
        - name: levels
          in: query
          description: Comma separated levels to run. Defaults to all three.
          schema: { type: string }
          example: street,neighborhood,district
        - name: street_eps
          in: query
          description: DBSCAN radius in feet for the street level.
          schema: { type: number, default: 1300 }
        - name: neighborhood_eps
          in: query
          description: DBSCAN radius in feet for the neighborhood level.
          schema: { type: number, default: 3000 }
        - name: district_eps
          in: query
          description: DBSCAN radius in feet for the district level.
          schema: { type: number, default: 13000 }
      responses:
        "200":
          description: One frame covering the whole range, and the run for the cluster-level heatmap.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  level_configs:
                    type: object
                    description: The settings each enabled level ran with.
                    additionalProperties:
                      type: object
                      properties:
                        epsilon: { type: number, description: DBSCAN radius in feet. }
                        min_pts: { type: integer }
                        color: { type: string }
                  frames:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string, example: All Incidents }
                        n_incidents: { type: integer }
                        levels:
                          type: object
                          description: One GeoJSON FeatureCollection of cluster outlines per enabled level.
                          additionalProperties: { type: object }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/animation/dbscan:
    get:
      summary: DBSCAN cluster animation frames
      description: |
        Windows the mapped incidents like /animation/kde-heatmap and runs
        DBSCAN at each enabled level in every window. Each frame's cluster
        levels are kept for an hour under the returned run_id, which the
        KDE-with-clusters routes need. At most 30 windows.
        Takes the same category, city, source and bbox filters as
        /api/v1/incidents. Dates come only from start_date and end_date, so
        days, from and to are refused.
      parameters:
        - $ref: "#/components/parameters/category"
        - $ref: "#/components/parameters/city"
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/bbox"
        - name: start_date
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-09-01"
        - name: end_date
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-09-29"
        - name: window_length
          in: query
          required: true
          description: A pandas offset such as 1D, 7D or 2W.
          schema: { type: string }
          example: 7D
        - name: time_step
          in: query
          required: true
          description: A pandas offset such as 1D, 7D or 2W.
          schema: { type: string }
          example: 7D
        - name: levels
          in: query
          description: Comma separated levels to run. Defaults to all three.
          schema: { type: string }
          example: street,neighborhood,district
        - name: street_eps
          in: query
          description: DBSCAN radius in feet for the street level.
          schema: { type: number, default: 1300 }
        - name: neighborhood_eps
          in: query
          description: DBSCAN radius in feet for the neighborhood level.
          schema: { type: number, default: 3000 }
        - name: district_eps
          in: query
          description: DBSCAN radius in feet for the district level.
          schema: { type: number, default: 13000 }
      responses:
        "200":
          description: The frames, oldest first, and the run to pass to the KDE-with-clusters routes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DbscanAnimation" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/animation/kde-heatmap-dbscan:
    get:
      summary: KDE animation weighted by DBSCAN cluster level
      description: |
        One heatmap per frame of a DBSCAN run, with one bandwidth per cluster
        level. Frame 1's levels set how many bandwidths are expected. Noise
        points are left out.
      parameters:
        - $ref: "#/components/parameters/run_id"
        - name: bandwidth
          in: query
          description: |
            KDE bandwidth in feet, repeated once per cluster level in frame 1
            and non-increasing. Clamped to 500 to 10000. Defaults to 1500 for
            every level.
          schema: { type: array, items: { type: number } }
          style: form
          explode: true
      responses:
        "200":
          description: The frames, in the run's order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KdeDbscanAnimation" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/animation/kde-heatmap-dbscan/status:
    get:
      summary: Whether a DBSCAN run can drive the KDE-with-clusters animation
      parameters:
        - $ref: "#/components/parameters/run_id"
      responses:
        "200":
          description: |
            missing when the run does not exist or has expired,
            no_cluster_levels when frame 1 is empty or all noise.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dbscan_status: { type: string, enum: [missing, no_cluster_levels, available] }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/gi-star-heatmap:
    get:
      summary: Getis-Ord Gi* heatmap of the mapped incidents
      description: |
        Counts the incidents in a grid of 2500 ft cells and colors each cell
        by its Gi* z-score: how much more (or less) busy it and its
        neighbors are than the county as a whole. Cells whose center is in
        the water are left out unless they hold an incident. Dates and
        filters work as on /api/v1/kde-heatmap. The response is kept for an
        hour under the run_id it returns, for /api/v1/reports?gi_star_run=.
      parameters:
        - name: start_date
          in: query
          description: Read as UTC. Defaults to the earliest incident.
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Read as UTC. Defaults to the latest incident.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/category"
        - $ref: "#/components/parameters/city"
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/bbox"
        - name: distance_band
          in: query
          description: |
            How far, in feet, from a cell's center its neighbors can be.
            Clamped to 500 to 10000. Defaults to 2500.
          schema: { type: number, default: 2500 }
      responses:
        "200":
          description: The heatmap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiStarHeatmap" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/animation/gi-star-heatmap:
    get:
      summary: Gi* heatmap animation frames
      description: |
        Windows the mapped incidents like /animation/kde-heatmap and returns
        one Gi* heatmap per window. All frames share one grid, sized from the
        incidents in every window, so every frame has the same bounds. At
        most 30 windows. Takes the same category, city, source and bbox
        filters as /api/v1/incidents. Dates come only from start_date and
        end_date, so days, from and to are refused.
      parameters:
        - name: start_date
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-09-01"
        - name: end_date
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-09-29"
        - name: window_length
          in: query
          required: true
          description: A pandas offset such as 1D, 7D or 2W.
          schema: { type: string }
          example: 7D
        - name: time_step
          in: query
          required: true
          description: A pandas offset such as 1D, 7D or 2W.
          schema: { type: string }
          example: 7D
        - name: distance_band
          in: query
          required: true
          description: Gi* distance band in feet. Clamped to 500 to 10000.
          schema: { type: number }
          example: 2500
        - $ref: "#/components/parameters/category"
        - $ref: "#/components/parameters/city"
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/bbox"
      responses:
        "200":
          description: The frames, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiStarAnimation" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/register:
    post:
      summary: Create an account
      description: |
        Signs the new account in as well, so a client never has to call login
        straight after registering.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Registration" }
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: That email already has an account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/login:
    post:
      summary: Start a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
        "401":
          description: |
            Wrong password, or no such account. The two are deliberately
            indistinguishable so the endpoint cannot be used to find out who
            has an account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/refresh:
    post:
      summary: Trade the refresh cookie for a new access token
      description: |
        Send no body. The browser supplies the cookie, so a cross-origin caller
        needs `credentials: "include"`.

        A refresh token works exactly once. This deletes the one presented and
        sets a new one, so replaying an old cookie fails.
      responses:
        "200":
          description: A new access token and a new refresh cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
        "401":
          description: |
            The cookie is missing, already used, expired, or belongs to a
            deleted account. The cookie is cleared, so the client should send
            the user back to the login screen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/logout:
    post:
      summary: End this session
      description: |
        Send no body. Deletes the presented refresh token and clears the
        cookie. Other devices stay signed in. Always succeeds, including when
        there was no session to end.
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: signed out }

  /api/v1/users/me:
    get:
      summary: The signed-in account
      security:
        - accessToken: []
      responses:
        "200":
          description: The account the access token belongs to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: |
            No token, or one that is malformed, expired, signed with another
            key, or belongs to a deleted account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/users/me/areas:
    get:
      summary: Your saved areas
      security:
        - accessToken: []
      responses:
        "200":
          description: Oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  areas:
                    type: array
                    items: { $ref: "#/components/schemas/SavedArea" }
        "401":
          $ref: "#/components/responses/SignIn"
    post:
      summary: Save an area
      description: |
        A circle you get alerts for. At most 10 per account. Saving your
        first area starts your alerts, so only incidents mapped after that
        show up in /api/v1/users/me/alerts.
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SavedAreaFields"
                - required: [name, lat, lon, radius_mi]
      responses:
        "201":
          description: The saved area.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedArea" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignIn"
        "409":
          description: You already have 10 saved areas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/users/me/areas/{area_id}:
    parameters:
      - name: area_id
        in: path
        required: true
        schema: { type: integer }
    patch:
      summary: Change a saved area
      description: Only the fields you send change.
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedAreaFields" }
      responses:
        "200":
          description: The area after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedArea" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignIn"
        "404":
          $ref: "#/components/responses/NoSuchArea"
    delete:
      summary: Delete a saved area
      security:
        - accessToken: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/SignIn"
        "404":
          $ref: "#/components/responses/NoSuchArea"

  /api/v1/users/me/alerts:
    get:
      summary: New incidents in your saved areas
      description: |
        Incidents mapped since you last marked alerts seen, inside any of your
        areas with alerts on and in that area's categories. Only incidents
        that happened in the last 30 days count, so an old incident mapped
        late doesn't alert. Oldest first, at most 100. Reading does not mark
        them seen, so the bell can poll this; when the user opens the bell,
        send the cursor to /api/v1/users/me/alerts/seen. If has_more is true,
        mark these seen and call again for the rest.
      security:
        - accessToken: []
      responses:
        "200":
          description: Your new alerts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Incident"
                        - type: object
                          properties:
                            areas:
                              type: array
                              items: { type: string }
                              description: The names of your areas the incident is in.
                  cursor:
                    type: [string, "null"]
                    description: Marks these alerts seen. Null when there are none.
                  has_more: { type: boolean }
        "401":
          $ref: "#/components/responses/SignIn"

  /api/v1/users/me/alerts/seen:
    post:
      summary: Mark alerts seen
      description: |
        Everything up to the cursor stops being an alert. A cursor older than
        what you have already marked seen changes nothing.
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cursor]
              properties:
                cursor: { type: string, description: The cursor from /api/v1/users/me/alerts. }
      responses:
        "204":
          description: Marked seen.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignIn"

  /api/v1/reports:
    get:
      summary: PDF report of the mapped incidents
      description: |
        A PDF with a map of the incidents, summary numbers, and charts by
        category, city, day, hour and weekday. Takes the same filters as
        /api/v1/incidents, but needs both from and to, and covers at most 366
        days counting both ends. Only incidents with a trusted coordinate
        inside Lee County are included, as on the map. Times are Eastern.

        kde_run, gi_star_run and dbscan_run add the heatmaps and clusters
        the user made on the map, by the run_id each route returned. A run
        not sent is left out of the report. A run is refused if it expired
        (after an hour), is a different analysis, or was made with other
        dates or filters: its start_date and end_date must equal from and
        to, and its category, city, source and bbox must equal the report's.
      security:
        - accessToken: []
      parameters:
        - name: from
          in: query
          required: true
          description: Start date, inclusive, read as Eastern time.
          schema: { type: string, format: date }
          example: "2026-09-01"
        - name: to
          in: query
          required: true
          description: End date, inclusive, read as Eastern time.
          schema: { type: string, format: date }
          example: "2026-09-30"
        - $ref: "#/components/parameters/category"
        - $ref: "#/components/parameters/city"
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/bbox"
        - name: kde_run
          in: query
          description: The run_id from /api/v1/kde-heatmap.
          schema: { type: string }
        - name: gi_star_run
          in: query
          description: The run_id from /api/v1/gi-star-heatmap.
          schema: { type: string }
        - name: dbscan_run
          in: query
          description: The run_id from /api/v1/clusters.
          schema: { type: string }
      responses:
        "200":
          description: The report, as a download named lee-county-report-FROM_to_TO.pdf.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignIn"

components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The `access_token` from register, login or refresh, sent as
        `Authorization: Bearer <token>`. Valid for 15 minutes.

  headers:
    RefreshCookie:
      description: |
        The refresh token, as an HttpOnly cookie scoped to `/api/v1/auth`.
        JavaScript cannot read it and the browser only sends it back to the
        auth routes. Cross-origin callers need `credentials: "include"`.
      schema: { type: string }

  parameters:
    days:
      name: days
      in: query
      description: Look back this many days from now. Cannot be combined with from/to.
      schema: { type: integer, minimum: 1, maximum: 3660 }
      example: 30
    from:
      name: from
      in: query
      description: Start date, inclusive, read as Eastern time.
      schema: { type: string, format: date }
      example: "2026-07-01"
    to:
      name: to
      in: query
      description: End date, inclusive, read as Eastern time.
      schema: { type: string, format: date }
    category:
      name: category
      in: query
      description: |
        Comma separated category codes from /incident-types. Selecting OTHER
        also returns incidents whose nature is not mapped yet.
      schema: { type: string }
      example: BURGLARY,THEFT
    city:
      name: city
      in: query
      description: |
        Comma separated canonical city names. Alternate spellings in the source
        data are matched automatically, so CAPE CORAL also finds CORAL.
      schema: { type: string }
      example: FORT MYERS
    source:
      name: source
      in: query
      description: Comma separated feed names.
      schema: { type: string }
      example: lee_county,lee_county_traffic
    bbox:
      name: bbox
      in: query
      description: Map viewport as west,south,east,north in WGS84 degrees.
      schema: { type: string }
      example: "-82.35,26.27,-81.50,26.90"
    mapped:
      name: mapped
      in: query
      description: |
        When true, only incidents with a coordinate that is inside Lee County
        and trusted. Defaults to false for JSON and true for GeoJSON.
      schema: { type: boolean }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 5000, default: 100 }
    cursor:
      name: cursor
      in: query
      description: Value of next_cursor from the previous page.
      schema: { type: string }
    run_id:
      name: run_id
      in: query
      required: true
      description: The run_id from /api/v1/animation/dbscan. Runs expire after an hour.
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }

  responses:
    BadRequest:
      description: A query parameter or body field was invalid. The message says which one.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SignIn:
      description: No access token, or one that is not valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoSuchArea:
      description: No area with that id belongs to you.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: days must be a whole number }

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }

    Registration:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 100 }

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name:
          type: string
          nullable: true
          description: Null only for accounts made before names were asked for.
        created_at: { type: string, format: date-time }

    Session:
      type: object
      description: |
        `access_token` goes in an `Authorization: Bearer` header and lasts
        `expires_in` seconds. The refresh token is not in this body; it is in
        the cookie.
      properties:
        user: { $ref: "#/components/schemas/User" }
        access_token: { type: string }
        expires_in: { type: integer, example: 900 }

    Incident:
      type: object
      properties:
        source:
          type: string
          enum: [lee_county, lee_county_traffic]
        source_incident_id: { type: string, example: "25-001" }
        occurred_at: { type: string, format: date-time }
        nature:
          type: [string, "null"]
          description: Raw text from the source feed. Not a stable value.
          example: BURGLARY - RESIDENCE
        category:
          type: string
          description: Stable code. Filter on this, not on nature.
          example: BURGLARY
        address: { type: [string, "null"] }
        city:
          type: [string, "null"]
          description: Canonical spelling. Null when the source had no usable city.
        lat: { type: [number, "null"] }
        lon: { type: [number, "null"] }
        disposition: { type: [string, "null"] }
        status:
          type: [string, "null"]
          description: Traffic feed only.

    IncidentPage:
      type: object
      properties:
        incidents:
          type: array
          items: { $ref: "#/components/schemas/Incident" }
        next_cursor:
          type: [string, "null"]
          description: Null on the last page.
        dataset_revision: { type: integer }

    FeatureCollection:
      type: object
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            properties:
              type: { type: string, const: Feature }
              id:
                type: string
                description: source and incident id joined by a colon.
                example: lee_county:25-001
              geometry:
                type: [object, "null"]
                description: Null when the incident has no coordinates.
                properties:
                  type: { type: string, const: Point }
                  coordinates:
                    type: array
                    description: Longitude first, then latitude.
                    items: { type: number }
                    minItems: 2
                    maxItems: 2
              properties: { $ref: "#/components/schemas/Incident" }
        next_cursor: { type: [string, "null"] }
        dataset_revision: { type: integer }

    Stats:
      type: object
      properties:
        total: { type: integer }
        by_category:
          type: array
          description: Largest first.
          items:
            type: object
            properties:
              category: { type: string }
              count: { type: integer }
        by_day:
          type: array
          description: Ascending by date, in Eastern time.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              count: { type: integer }
        by_hour:
          type: array
          description: |
            Local hour 0 to 23. Incidents recorded at exactly midnight are left
            out, because that timestamp means "time not recorded" rather than an
            incident at midnight.
          items:
            type: object
            properties:
              hour: { type: integer, minimum: 0, maximum: 23 }
              count: { type: integer }
        excluded_from_by_hour:
          type: integer
          description: How many incidents by_hour left out.
        by_weekday:
          type: array
          description: 1 is Monday, 7 is Sunday.
          items:
            type: object
            properties:
              weekday: { type: integer, minimum: 1, maximum: 7 }
              count: { type: integer }
        dataset_revision: { type: integer }

    Bounds:
      type: object
      description: Where the image goes on the map, in WGS84 degrees.
      properties:
        west: { type: number }
        south: { type: number }
        east: { type: number }
        north: { type: number }

    KdeHeatmap:
      type: object
      properties:
        image: { type: string, description: A PNG as a data URL. }
        bounds: { $ref: "#/components/schemas/Bounds" }
        legend:
          type: object
          properties:
            colors: { type: array, items: { type: string, example: "#0000ff" } }
            vmin: { type: number }
            vmax: { type: number }
            ticks: { type: array, items: { type: number } }
            caption: { type: string }
        bandwidths: { type: array, items: { type: number } }
        min_bandwidth: { type: number }
        max_bandwidth: { type: number }
        cluster_set: { type: integer }
        cluster_set_labels: { type: array, items: { type: string } }
        dbscan_status: { type: string, enum: [missing, all_noise, available] }
        run_id:
          type: string
          description: This heatmap's own run, for /api/v1/reports?kde_run=. Not the run_id sent in.

    GiStarHeatmap:
      type: object
      properties:
        image: { type: string, description: A PNG as a data URL. }
        bounds: { $ref: "#/components/schemas/Bounds" }
        legend:
          type: object
          properties:
            colors: { type: array, items: { type: string } }
            vmin: { type: number }
            vmax: { type: number }
            ticks: { type: array, items: { type: number } }
            caption: { type: string, example: Gi* z-score }
        distance_band: { type: number }
        min_distance_band: { type: number }
        max_distance_band: { type: number }
        run_id: { type: string, description: "For /api/v1/reports?gi_star_run=." }

    GiStarAnimation:
      type: object
      properties:
        distance_band: { type: number }
        min_distance_band: { type: number }
        max_distance_band: { type: number }
        frames:
          type: array
          items:
            type: object
            properties:
              label: { type: string, example: "2026-09-01 00:00 - 2026-09-08 00:00" }
              window_start: { type: string, format: date-time }
              window_end: { type: string, format: date-time }
              n_incidents: { type: integer }
              image:
                type: [string, "null"]
                description: A PNG as a data URL. Null when the window has no incidents.
              image_filename: { type: [string, "null"] }
              bounds:
                oneOf:
                  - $ref: "#/components/schemas/Bounds"
                  - type: "null"

    SavedAreaFields:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Home }
        lat:
          type: number
          minimum: 26.2
          maximum: 27.0
          description: The center. Must be in or near Lee County.
          example: 26.64
        lon: { type: number, minimum: -82.4, maximum: -81.4, example: -81.87 }
        radius_mi: { type: number, minimum: 0.1, maximum: 10, example: 0.5 }
        categories:
          type: array
          items: { type: string }
          description: Codes from /api/v1/incident-types. Empty means every category.
          example: [BURGLARY, THEFT]
        alerts_enabled: { type: boolean, default: true }

    SavedArea:
      allOf:
        - $ref: "#/components/schemas/SavedAreaFields"
        - type: object
          properties:
            id: { type: integer }
            created_at: { type: string, format: date-time }

    KdeAnimation:
      type: object
      properties:
        bandwidth: { type: number }
        min_bandwidth: { type: number }
        max_bandwidth: { type: number }
        frames:
          type: array
          items:
            type: object
            properties:
              label: { type: string, example: "2026-09-01 00:00 - 2026-09-08 00:00" }
              window_start: { type: string, format: date-time }
              window_end: { type: string, format: date-time }
              n_incidents: { type: integer }
              image:
                type: [string, "null"]
                description: A PNG as a data URL. Null when the window has no incidents.
              image_filename: { type: [string, "null"] }
              bounds:
                oneOf:
                  - $ref: "#/components/schemas/Bounds"
                  - type: "null"

    DbscanAnimation:
      type: object
      properties:
        run_id: { type: string }
        frames:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              window_start: { type: string, format: date-time }
              window_end: { type: string, format: date-time }
              n_incidents: { type: integer }
              levels:
                type: object
                description: One GeoJSON FeatureCollection of cluster outlines per enabled level.
                additionalProperties: { type: object }

    KdeDbscanAnimation:
      type: object
      properties:
        bandwidths: { type: array, items: { type: number } }
        min_bandwidth: { type: number }
        max_bandwidth: { type: number }
        frames:
          type: array
          items:
            type: object
            properties:
              label: { type: string, example: Frame 1 }
              n_incidents: { type: integer }
              image:
                type: [string, "null"]
                description: A PNG as a data URL. Null when the frame is empty or all noise.
              image_filename: { type: [string, "null"] }
              bounds:
                oneOf:
                  - $ref: "#/components/schemas/Bounds"
                  - type: "null"
              note:
                type: [string, "null"]
                description: Why a frame has no image.
