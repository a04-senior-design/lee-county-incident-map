[project]
name = "leecad-api"
version = "0.1.0"
description = "Public read API over the Lee County incident database"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1",
    "flask>=3.1",
    "flask-cors>=6.0",
    "kdepy==1.1.12",
    "matplotlib==3.11.2",
    "psycopg[binary,pool]>=3.3",
    "pyjwt>=2.10",
    "python-dotenv>=1.2",
    "rasterio==1.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leecad_api"]
# backend/ goes on the path too, so we can import from backend/ml
dev-mode-dirs = ["src", ".."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
