<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KDE Heatmap Lab — Lee County</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ─────────────────────────────────────────────────────────── */
    #top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0.6rem 1.2rem;
      background: rgba(15, 15, 30, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    #branding { line-height: 1.3; }
    #branding strong { font-size: 1rem; color: #fff; }
    #branding span   { display: block; font-size: 0.72rem; color: #888; }

    /* ── Map ──────────────────────────────────────────────────────────────── */
    #map { flex: 1; }
  </style>
</head>
<body>

<div id="top-bar">
  <div id="branding">
    <strong>KDE Heatmap Lab</strong>
    <span>Lee County Incidents — dev prototype</span>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const LEE_COUNTY_CENTER = [26.56, -81.87];
  const DEFAULT_ZOOM = 11;

  // map setup
  const map = L.map("map").setView(LEE_COUNTY_CENTER, DEFAULT_ZOOM);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);

  // fetch and overlay the KDE density heatmap
  fetch("/api/heatmap")
    .then(res => res.json())
    .then(data => {
      const b = data.bounds;
      const imageBounds = [[b.south, b.west], [b.north, b.east]];
      L.imageOverlay(data.image, imageBounds, {opacity: 0.8}).addTo(map);
    })
    .catch(err => console.error("Heatmap fetch failed: ", err))
})();
</script>
</body>
</html>
