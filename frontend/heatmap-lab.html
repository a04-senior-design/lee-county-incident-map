<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KDE Heatmap Lab — Lee County</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ─────────────────────────────────────────────────────────── */
    #top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0.6rem 1.2rem;
      background: rgba(15, 15, 30, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    #branding { line-height: 1.3; }
    #branding strong { font-size: 1rem; color: #fff; }
    #branding span   { display: block; font-size: 0.72rem; color: #888; }

    /* ── Bandwidth Slide ──────────────────────────────────────────────────── */

    .param-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .param-row label {
      font-size: 0.75rem;
      color: #aaa;
      white-space: nowrap;
    }
    .param-row label span {
      color: #fff;
      font-weight: 600;
    }
    #bandwidth-slider {
      width: 200px;
    }

    /* ── Map ──────────────────────────────────────────────────────────────── */
    #map { flex: 1; }

    /* ── Legend ───────────────────────────────────────────────────────────── */
    .legend {
      background: rgba(15, 15, 30, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      font-size: 0.75rem;
      color: #eee;
    }
    .legend-caption {
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .legend-gradient {
      width: 180px;
      height: 12px;
      border-radius: 2px;
      margin-bottom: 0.3rem;
    }
    .legend-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: #aaa;
    }

  </style>
</head>
<body>

<div id="top-bar">
  <div id="branding">
    <strong>KDE Heatmap Lab</strong>
    <span>Lee County Incidents — dev prototype</span>
  </div>

  <div class="param-row">
    <label for="bandwidth-slider">Bandwidth: <span id="bandwidth-value">—</span></label>
    <input type="range" id="bandwidth-slider" min="0" max="1" step="1" value="0" disabled />
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const LEE_COUNTY_CENTER = [26.56, -81.87];
  const DEFAULT_ZOOM = 11;

  // map setup
  const map = L.map("map").setView(LEE_COUNTY_CENTER, DEFAULT_ZOOM);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);

  const slider = document.getElementById("bandwidth-slider");
  const valueLabel = document.getElementById("bandwidth-value");

  let overlayLayer = null;
  let legendControl = null;
  let debounceTimer = null;

  function renderHeatmap(data) {
    // remove previous overlay/legend before adding new one
    if (overlayLayer) map.removeLayer(overlayLayer);
    if (legendControl) legendControl.remove();

    const b = data.bounds;
    const imageBounds = [[b.south, b.west], [b.north, b.east]];
    overlayLayer = L.imageOverlay(data.image, imageBounds, {opacity: 0.8}).addTo(map);

    // build and add the density legend
    const legend = data.legend;
    const gradientCss = `linear-gradient(to right, ${legend.colors.join(", ")})`;
    const tickLabels = legend.ticks
      .map(t => `<span>${Number(t.toPrecision(2))}</span>`)
      .join("");

    legendControl = L.control({ position: "bottomright" });
    legendControl.onAdd = () => {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML = `
        <div class="legend-caption">${legend.caption}</div>
        <div class="legend-gradient" style="background: ${gradientCss};"></div>
        <div class="legend-ticks">${tickLabels}</div>
      `;
      return div;
    };
    legendControl.addTo(map);
  }

  function fetchHeatmap(bandwidth) {
    const url = bandwidth === undefined
      ? "/api/heatmap"
      : `/api/heatmap?bandwidth=${bandwidth}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          renderHeatmap(data);

          // initialize slider range/value on first load only
          if (slider.disabled) {
            slider.min = data.min_bandwidth;
            slider.max = data.max_bandwidth;
            slider.disabled = false;
          }
          slider.value = data.bandwidth;
          valueLabel.textContent = Math.round(data.bandwidth);
        })
        .catch(err => console.error("Heatmap fetch failed: ", err));
  }

  slider.addEventListener("input", () => {
    valueLabel.textContent = slider.value;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => fetchHeatmap(Number(slider.value)), 400);
  });

  // boot: fetch with no bandwidth parameter, letting the backend supply its default
  fetchHeatmap();  
})();
</script>
</body>
</html>
